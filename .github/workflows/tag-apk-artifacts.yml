name: Tag APK Artifacts

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Cache LFS
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('**/*.txz', '**/*.tzst') }}
          restore-keys: lfs-

      - name: Pull LFS files
        run: git lfs pull

      - name: Cache NDK build outputs
        uses: actions/cache@v5
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: tag-ndk-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            tag-ndk-
            ndk-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: 'on-success'

      - name: Decode keystore and build debug APK
        timeout-minutes: 15
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:+UseG1GC
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            export KEYSTORE_PASSWORD="dummypass"
            export KEY_ALIAS="winnative"
            export KEY_PASSWORD="dummypass"
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -alias winnative \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass dummypass -keypass dummypass \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
          fi
          ./gradlew \
            :app:assembleStandardDebug \
            :app:assembleLudashiDebug \
            :app:assemblePubgDebug \
            :app:assembleAntunuDebug \
            --build-cache --parallel -x lint

      - name: Prepare APKs for upload
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:space:]' '-' | tr -cd 'A-Za-z0-9._-')
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          prepare() {
            dir="artifacts/$1"
            mkdir -p "$dir"
            cp "$2" "$dir/WinNative-${safe_ref}-$1.apk"
          }
          prepare Standard app/build/outputs/apk/standard/debug/standard.apk
          prepare Ludashi  app/build/outputs/apk/ludashi/debug/ludashi.apk
          prepare Pubg     app/build/outputs/apk/pubg/debug/pubg.apk
          prepare Antunu   app/build/outputs/apk/antunu/debug/antunu.apk

      - name: Upload Standard APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-${{ steps.package.outputs.safe_ref }}-Standard
          path: artifacts/Standard/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Ludashi APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-${{ steps.package.outputs.safe_ref }}-Ludashi
          path: artifacts/Ludashi/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Pubg APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-${{ steps.package.outputs.safe_ref }}-Pubg
          path: artifacts/Pubg/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Antunu APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-${{ steps.package.outputs.safe_ref }}-Antunu
          path: artifacts/Antunu/*.apk
          retention-days: 30
          if-no-files-found: error
