name: Tag APK Artifact

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Cache LFS
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('**/*.txz', '**/*.tzst') }}
          restore-keys: lfs-

      - name: Pull LFS files
        run: git lfs pull

      - name: Cache NDK build outputs
        uses: actions/cache@v5
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: tag-ndk-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            tag-ndk-
            ndk-

      - name: Cache Rust Steam client
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/cpp/wn-steam-client/rust/target
          key: cargo-${{ hashFiles('app/src/main/cpp/wn-steam-client/rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            export KEYSTORE_PASSWORD=dummypass
            export KEY_ALIAS=ci
            export KEY_PASSWORD=dummypass
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias ci \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass dummypass -keypass dummypass \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
          fi

      - name: Build single APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dummypass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ci' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dummypass' }}
          VERSION_NAME: ${{ github.ref_name }}
          GRADLE_OPTS: -Xmx4g -XX:+UseG1GC
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --build-cache --parallel -x lint
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for upload
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:space:]' '-' | tr -cd 'A-Za-z0-9._-')
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/apk/WinNative-${safe_ref}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-${{ github.ref_name }}
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
