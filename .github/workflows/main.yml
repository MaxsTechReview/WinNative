name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"

      - name: Prepare launcher resources
        shell: bash
        run: |
          set -e

          MAIN_RES="app/src/main/res"
          STANDARD_RES="app/src/standard/res"

          mkdir -p "$MAIN_RES"

          if [ -d "$STANDARD_RES" ]; then
            for dir in \
              mipmap-mdpi \
              mipmap-hdpi \
              mipmap-xhdpi \
              mipmap-xxhdpi \
              mipmap-xxxhdpi \
              mipmap-anydpi \
              mipmap-anydpi-v26
            do
              if [ -d "$STANDARD_RES/$dir" ]; then
                mkdir -p "$MAIN_RES/$dir"

                cp -rn \
                  "$STANDARD_RES/$dir"/ic_launcher* \
                  "$MAIN_RES/$dir"/ 2>/dev/null || true
              fi
            done
          fi

          test -e "$MAIN_RES/mipmap-mdpi/ic_launcher.png" \
            || test -e "$MAIN_RES/mipmap-anydpi-v26/ic_launcher.xml" \
            || {
              echo "::error::ic_launcher resource is missing"
              exit 1
            }

          echo "Launcher resources:"
          find "$MAIN_RES" -type f \
            \( -name 'ic_launcher*' \) \
            -print

      - name: Verify native dependencies
        shell: bash
        run: |
          set -e

          test -d app/src/main/cpp/adrenotools
          test -f app/src/main/cpp/adrenotools/CMakeLists.txt

          echo "Native dependencies OK"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
